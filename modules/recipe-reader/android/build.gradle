plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.archont.mealplanner'
version = '0.1.0'

android {
  namespace "expo.modules.recipereader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // On-device text recognition (Latin script), bundled in the app so it works offline at once.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Gemini Nano through Android AICore (ML Kit GenAI Prompt API).
  // beta3+ is built with Kotlin 2.3; Expo SDK 57 compiles with Kotlin 2.1, so stay on beta2 for now.
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
}
